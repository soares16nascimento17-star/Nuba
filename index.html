<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nubank</title>

    <!-- CONFIGURAÇÕES PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nubank">
    <meta name="theme-color" content="#820AD1">
    
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/f/f7/Nu_logo.svg">
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/f/f7/Nu_logo.svg">

    <style>
        :root {
            --nu-purple: #820AD1;
            --nu-bg: #000000;
            --nu-card: #121212;
            --nu-card-secondary: #1E1E1E;
            --nu-text-main: #FFFFFF;
            --nu-text-sub: #A1A1A1;
            --nu-btn-gray: #262626;
            --nu-green: #27A745;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --radius-card: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--nu-bg);
            color: var(--nu-text-main);
            overflow: hidden;
        }

        .app-shell {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--nu-bg);
            position: relative;
        }

        /* --- SPLASH SCREEN --- */
        .splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--nu-purple);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-logo {
            width: 110px;
            height: auto;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* --- TELA DE LOGIN --- */
        .login-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--nu-purple);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top, 40px) + 20px) 28px calc(env(safe-area-inset-bottom, 20px) + 24px) 28px;
            color: #FFF;
        }

        .login-header-logo {
            width: 70px;
            height: auto;
        }

        .login-body {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .login-greeting {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-sub {
            font-size: 15px;
            opacity: 0.85;
            margin-bottom: 32px;
        }

        /* PIN DOTS DA SENHA */
        .pin-container {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            width: 100%;
            justify-content: center;
        }

        .pin-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            transition: background-color 0.2s, border-color 0.2s;
        }

        .pin-dot.filled {
            background-color: #FFFFFF;
            border-color: #FFFFFF;
        }

        .hidden-pin-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .biometric-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 14px 24px;
            border-radius: 30px;
            color: #FFF;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .biometric-btn svg {
            width: 22px;
            height: 22px;
            fill: #FFF;
        }

        .login-footer {
            font-size: 13px;
            opacity: 0.8;
            text-align: center;
            width: 100%;
        }

        /* --- HEADER DA TELA PRINCIPAL --- */
        .nu-header {
            background-color: var(--nu-purple);
            padding: calc(env(safe-area-inset-top, 20px) + 16px) 20px 20px 20px;
            color: #FFF;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .profile-btn {
            width: 48px;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .profile-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: #FFF;
            border-radius: 50%;
        }

        .header-actions {
            display: flex;
            gap: 18px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #FFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: #FFF;
        }

        .user-greeting {
            font-size: 18px;
            font-weight: 700;
        }

        /* --- CORPO ROLÁVEL --- */
        .nu-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 100px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nu-body::-webkit-scrollbar { display: none; }

        .account-section {
            cursor: pointer;
            margin-bottom: 8px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--nu-text-main);
            margin-bottom: 6px;
        }

        .chevron {
            color: var(--nu-text-sub);
            font-size: 16px;
        }

        .card-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--nu-text-main);
            letter-spacing: -0.5px;
        }

        /* ACTIONS SCROLL COM ÍCONES REAIS DO NUBANK */
        .actions-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 0 12px 0;
        }

        .actions-scroll::-webkit-scrollbar { display: none; }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 72px;
            border: none;
            background: transparent;
            cursor: pointer;
            position: relative;
        }

        .action-circle {
            width: 60px;
            height: 60px;
            background-color: var(--nu-btn-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .action-circle svg {
            width: 24px;
            height: 24px;
            fill: #FFFFFF;
        }

        .action-badge {
            position: absolute;
            top: 48px;
            background: var(--nu-purple);
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .action-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--nu-text-main);
            text-align: center;
            line-height: 1.2;
        }

        .my-cards-btn {
            background-color: var(--nu-btn-gray);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--nu-text-main);
            cursor: pointer;
        }

        .my-cards-btn svg {
            width: 20px;
            height: 20px;
            fill: #FFFFFF;
        }

        .nu-card {
            background: var(--nu-card);
            border-radius: var(--radius-card);
            padding: 20px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        /* MENU INFERIOR FLUTUANTE DE 3 ÍCONES */
        .bottom-nav-container {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
        }

        .bottom-nav-pill {
            pointer-events: auto;
            background-color: rgba(30, 30, 30, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--nu-text-sub);
            cursor: pointer;
        }

        .nav-btn.active {
            background-color: var(--nu-purple);
            color: #FFF;
        }

        .nav-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* --- TELA DE PERFIL / CONFIGURAÇÕES --- */
        .profile-menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FFFFFF;
            color: #000000;
            z-index: 1500;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .profile-menu-header {
            padding: calc(env(safe-area-inset-top, 20px) + 12px) 20px 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #F0F0F0;
        }

        .profile-menu-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #333;
        }

        .menu-section-title {
            padding: 20px 20px 8px 20px;
            font-size: 13px;
            font-weight: 600;
            color: #767676;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #F5F5F5;
            cursor: pointer;
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-item-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
        }

        .menu-item-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .menu-item-label {
            font-size: 15px;
            font-weight: 500;
            color: #111;
        }

        .menu-tag {
            background-color: #820AD1;
            color: #FFF;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 8px;
        }

        /* --- MODAIS E SHEETS --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            display: none;
            justify-content: flex-end;
            flex-direction: column;
        }

        .sheet {
            background-color: var(--nu-card);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px calc(env(safe-area-inset-bottom, 20px) + 20px) 20px;
            max-height: 90%;
            overflow-y: auto;
            color: #FFF;
            animation: slideUp 0.25s ease-out forwards;
        }

        .sheet-indicator {
            width: 36px;
            height: 5px;
            background-color: #333;
            border-radius: 3px;
            margin: 0 auto 20px auto;
        }

        .sheet-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--nu-text-sub);
            margin-bottom: 6px;
            display: block;
        }

        .field-input {
            width: 100%;
            padding: 16px;
            background-color: var(--nu-btn-gray);
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 16px;
            color: #FFF;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-main {
            width: 100%;
            background-color: var(--nu-purple);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-sub {
            width: 100%;
            background-color: var(--nu-btn-gray);
            color: #FFF;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- SPLASH SCREEN DE ENTRADA -->
    <div class="splash-screen" id="splash-screen">
        <svg class="splash-logo" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 180 720 L 180 420 C 180 285, 305 180, 440 180 C 575 180, 590 300, 590 420 L 590 720 L 420 720 L 420 420 C 420 355, 365 330, 330 330 C 285 330, 330 420, 330 420 L 330 720 Z" fill="#FFFFFF"/>
            <path d="M 420 280 L 420 580 C 420 715, 545 820, 680 820 C 815 820, 830 700, 830 580 L 830 280 L 660 280 L 660 580 C 660 645, 605 670, 570 670 C 525 670, 570 580, 570 580 L 570 280 Z" fill="#FFFFFF"/>
        </svg>
    </div>

    <!-- TELA DE LOGIN ESTILO NUBANK -->
    <div class="login-screen" id="login-screen" onclick="focusPinInput()">
        <div>
            <svg class="login-header-logo" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 180 720 L 180 420 C 180 285, 305 180, 440 180 C 575 180, 590 300, 590 420 L 590 720 L 420 720 L 420 420 C 420 355, 365 330, 330 330 C 285 330, 330 420, 330 420 L 330 720 Z" fill="#FFFFFF"/>
                <path d="M 420 280 L 420 580 C 420 715, 545 820, 680 820 C 815 820, 830 700, 830 580 L 830 280 L 660 280 L 660 580 C 660 645, 605 670, 570 670 C 525 670, 570 580, 570 580 L 570 280 Z" fill="#FFFFFF"/>
            </svg>
        </div>

        <div class="login-body">
            <div class="login-greeting" id="login-greeting-text">Olá, Clara</div>
            <div class="login-sub" id="login-sub-text">Digite sua senha de acesso de 4 dígitos</div>

            <div class="pin-container">
                <div class="pin-dot" id="dot-0"></div>
                <div class="pin-dot" id="dot-1"></div>
                <div class="pin-dot" id="dot-2"></div>
                <div class="pin-dot" id="dot-3"></div>
            </div>

            <input type="password" class="hidden-pin-input" id="real-pin-input" maxlength="4" inputmode="numeric" oninput="handlePinInput()">

            <button class="biometric-btn" onclick="loginWithBiometrics(event)">
